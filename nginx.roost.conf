# Example Nginx server block for the ROOST frontend (place in /etc/nginx/sites-available/)
server {
    listen 80;
    server_name 16.192.175.38;

    root /var/www/roost-frontend;
    index index.html;

    # SPA fallback: any unknown path serves index.html so React Router works
    location / {
        try_files $uri /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy the API on the same instance so the frontend can call
    # /api/... without CORS issues (optional — VITE_API_BASE_URL already
    # points straight at the backend, so this block is only needed if you
    # switch to same-origin API calls).
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
